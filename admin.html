<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Section Notice Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🔐 Admin Panel</h1></header>
<div class="wrap">

  <div id="authBox">
    <div class="panel">
      <h2>Admin login</h2>
      <input id="email" type="email" placeholder="Admin email">
      <input id="pass" type="password" placeholder="Password">
      <div class="err" id="err"></div>
      <button onclick="login()">Log in</button>
    </div>
  </div>

  <div id="adminBox" style="display:none">

    <div class="panel">
      <h2>Theme</h2>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div class="panel">
      <h2>Add / update notice</h2>
      <input type="hidden" id="editId">
      <div class="row">
        <div><label>Type</label>
          <select id="type">
            <option value="test">Class Test</option>
            <option value="presentation">Presentation</option>
            <option value="assignment">Assignment</option>
            <option value="midterm">Midterm</option>
            <option value="final">Final Exam</option>
            <option value="reminder">Reminder</option>
          </select>
        </div>
        <div><label>Course</label>
          <select id="course">
            <option value="">Select course</option>
            <option value="Systems Analysis and Design">Systems Analysis and Design</option>
            <option value="Digital Logic Design">Digital Logic Design</option>
            <option value="Digital Logic Design lab">Digital Logic Design lab</option>
            <option value="Data Communication">Data Communication</option>
            <option value="Theory of Computation">Theory of Computation</option>
          </select>
        </div>
      </div>
      <label>Title</label>
      <input id="title" placeholder="e.g. Class Test 2">
      <div class="row">
        <div><label>Date</label><input id="date" type="date"></div>
        <div><label>Time</label><input id="time" type="time"></div>
      </div>
      <div class="row">
        <div><label>Lecture(s) covered</label><input id="lecture" placeholder="e.g. Lecture 4-6"></div>
        <div><label>Slide / syllabus ref</label><input id="slide" placeholder="e.g. Slide 12-40"></div>
      </div>
      <label>Description / notes</label>
      <textarea id="description" rows="2"></textarea>
      <button onclick="saveNotice()">Save notice</button>
      <button onclick="resetForm()" style="background:#333a5c">Clear</button>
    </div>

    <div class="panel">
      <h2>All notices</h2>
      <div id="list"></div>
    </div>
    <button onclick="firebase.auth().signOut()" style="background:#333a5c">Log out</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const THEMES = {
  oceanEmber:  {label:"Ocean Ember",  bg1:"#08313f", bg2:"#0d3f50", card:"#114a5c", card2:"#17607a", accent:"#ff7452", text:"#f0fbff", muted:"#9fc4d1", test:"#ff5c5c", pres:"#ff9f45", assign:"#38c6d9", exam:"#a06bff", reminder:"#4de0b0"},
  midnightGold:{label:"Midnight Gold",bg1:"#12122b", bg2:"#1a1a3d", card:"#1e2049", card2:"#262a5c", accent:"#f4b942", text:"#f5f6ff", muted:"#9a9dc9", test:"#ef476f", pres:"#f4b942", assign:"#4cc9f0", exam:"#b185db", reminder:"#4dd8a0"},
  emeraldRose: {label:"Emerald Rose", bg1:"#0b2e28", bg2:"#123a31", card:"#164539", card2:"#1d5446", accent:"#ff6f91", text:"#f2fbf7", muted:"#93bdae", test:"#ff6f91", pres:"#ffb454", assign:"#45c4b0", exam:"#9d6fff", reminder:"#5be7a9"},
  plumSunset:  {label:"Plum Sunset",  bg1:"#2a1435", bg2:"#331a42", card:"#3a1f4d", card2:"#482760", accent:"#ff8552", text:"#faf3ff", muted:"#c3a8db", test:"#ff5d6c", pres:"#ff8552", assign:"#4dc9ff", exam:"#d16bff", reminder:"#58e0b0"},
  tealCoral:   {label:"Teal Coral",   bg1:"#0e3a41", bg2:"#13454d", card:"#134b53", card2:"#1b5d66", accent:"#e2584a", text:"#f3fbfa", muted:"#a9c7c8", test:"#e2584a", pres:"#f2a154", assign:"#4dd0c4", exam:"#c9506d", reminder:"#3ddab0"}
};

function applyTheme(id){
  const t = THEMES[id]; if(!t) return;
  const r = document.documentElement.style;
  r.setProperty('--bg1',t.bg1); r.setProperty('--bg2',t.bg2);
  r.setProperty('--card',t.card); r.setProperty('--card2',t.card2);
  r.setProperty('--accent',t.accent); r.setProperty('--text',t.text);
  r.setProperty('--muted',t.muted); r.setProperty('--test',t.test);
  r.setProperty('--pres',t.pres); r.setProperty('--assign',t.assign);
  r.setProperty('--exam',t.exam); r.setProperty('--reminder',t.reminder);
  document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.toggle('active', s.dataset.id===id));
}

function setTheme(id){
  applyTheme(id);
  db.collection('config').doc('theme').set({id});
}

function buildThemeGrid(){
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = Object.entries(THEMES).map(([id,t])=>
    `<div class="theme-swatch" data-id="${id}" onclick="setTheme('${id}')"
      style="background:linear-gradient(135deg, ${t.bg1}, ${t.accent})"><span>${t.label}</span></div>`
  ).join('');
}

function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .catch(e => document.getElementById('err').textContent = e.message);
}

auth.onAuthStateChanged(user => {
  const isAdmin = user && ADMIN_EMAILS.includes(user.email);
  document.getElementById('authBox').style.display = isAdmin ? 'none' : 'block';
  document.getElementById('adminBox').style.display = isAdmin ? 'block' : 'none';
  if(user && !isAdmin) auth.signOut();
  if(isAdmin){ loadList(); loadTheme(); }
});

function loadTheme(){
  buildThemeGrid();
  db.collection('config').doc('theme').get().then(doc=>{
    const id = doc.exists ? doc.data().id : 'oceanEmber';
    applyTheme(id);
  });
}

function resetForm(){
  ['editId','title','lecture','slide','description'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('date').value='';
  document.getElementById('time').value='';
  document.getElementById('type').value='test';
  document.getElementById('course').value='';
}

function saveNotice(){
  const data = {
    type: document.getElementById('type').value,
    course: document.getElementById('course').value,
    title: document.getElementById('title').value,
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    lecture: document.getElementById('lecture').value,
    slide: document.getElementById('slide').value,
    description: document.getElementById('description').value,
  };
  const id = document.getElementById('editId').value;
  const ref = id ? db.collection('notices').doc(id) : db.collection('notices').doc();
  ref.set(data).then(resetForm);
}

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function loadList(){
  db.collection('notices').onSnapshot(snap => {
    const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    items.sort((a,b) => (a.date+'T'+(a.time||'00:00')).localeCompare(b.date+'T'+(b.time||'00:00')));
    document.getElementById('list').innerHTML = items.map(n => {
      return `<div class="item-row">
        <span>[${n.type}] ${n.title} — ${fmtDate(n.date)}${n.time?(' '+n.time):''} ${n.course?('('+n.course+')'):''}</span>
        <span>
          <button onclick='editNotice("${n.id}")' style="background:var(--accent)">Edit</button>
          <button onclick='deleteNotice("${n.id}")'>Delete</button>
        </span>
      </div>`;
    }).join('');
  });
}

function editNotice(id){
  db.collection('notices').doc(id).get().then(doc => {
    const n = doc.data();
    document.getElementById('editId').value = id;
    document.getElementById('type').value = n.type;
    document.getElementById('course').value = n.course||'';
    document.getElementById('title').value = n.title||'';
    document.getElementById('date').value = n.date||'';
    document.getElementById('time').value = n.time||'';
    document.getElementById('lecture').value = n.lecture||'';
    document.getElementById('slide').value = n.slide||'';
    document.getElementById('description').value = n.description||'';
    window.scrollTo(0,0);
  });
}

function deleteNotice(id){
  if(confirm('Delete this notice?')) db.collection('notices').doc(id).delete();
}
</script>
</body>
</html>
