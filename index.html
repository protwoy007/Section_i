<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>68_I Notice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img id="bannerImg" class="banner-img" style="display:none" alt="Notice board banner">
  <h1>68_I Notice Board</h1>
</header>
<div class="wrap">
  <div class="filters">
    <select id="courseFilter"><option value="">All courses</option></select>
    <select id="typeFilter">
      <option value="">All types</option>
      <option value="test">Class Test</option>
      <option value="presentation">Presentation</option>
      <option value="assignment">Assignment</option>
      <option value="midterm">Midterm</option>
      <option value="final">Final Exam</option>
      <option value="reminder">Reminder</option>
    </select>
  </div>
  <div id="grid" class="grid"><div class="empty">Loading notices...</div></div>
</div>
<footer class="site-footer">Khaled 2026</footer>
<a class="admin-link" href="admin.html">Admin login →</a>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const TYPE_LABEL = {test:"Class Test",presentation:"Presentation",assignment:"Assignment",midterm:"Midterm",final:"Final Exam",reminder:"Reminder"};
let notices = [];

const THEMES = {
  deepNavyGold:{bg1:"#0b1220", bg2:"#111a2e", card:"#16213a", card2:"#1c2a47", accent:"#c9a227", text:"#f4f1e8", muted:"#9aa3b8", test:"#c1666b", pres:"#c9a227", assign:"#4f89c4", exam:"#8b7bb3", reminder:"#5fa88f"},
  graphiteCyan:{bg1:"#14181d", bg2:"#1b2126", card:"#20272e", card2:"#28313a", accent:"#4fd1c5", text:"#eef2f3", muted:"#9aa7ac", test:"#e0645a", pres:"#e0a458", assign:"#4fd1c5", exam:"#8b8fd6", reminder:"#5fbf8a"},
  slateIndigo: {bg1:"#141b2e", bg2:"#1b2440", card:"#1f2947", card2:"#28325c", accent:"#6d7fe0", text:"#f1f3fc", muted:"#98a0c3", test:"#e0687a", pres:"#e0a75f", assign:"#6d7fe0", exam:"#a17fd6", reminder:"#5cb894"},
  charcoalTeal:{bg1:"#101414", bg2:"#161c1c", card:"#1c2323", card2:"#242d2d", accent:"#3fb5a3", text:"#eef4f2", muted:"#93a3a0", test:"#d3665f", pres:"#d6a15b", assign:"#4f9ecf", exam:"#8a83c9", reminder:"#3fb5a3"},
  warmBurgundy:{bg1:"#1a1614", bg2:"#221c19", card:"#2a2320", card2:"#332b27", accent:"#9c3b4a", text:"#f3ede8", muted:"#b0a49a", test:"#9c3b4a", pres:"#b8863f", assign:"#5a8bab", exam:"#8672a0", reminder:"#5f9c73"}
};

function applyTheme(id){
  const t = THEMES[id]; if(!t) return;
  const r = document.documentElement.style;
  r.setProperty('--bg1',t.bg1); r.setProperty('--bg2',t.bg2);
  r.setProperty('--card',t.card); r.setProperty('--card2',t.card2);
  r.setProperty('--accent',t.accent); r.setProperty('--text',t.text);
  r.setProperty('--muted',t.muted); r.setProperty('--test',t.test);
  r.setProperty('--pres',t.pres); r.setProperty('--assign',t.assign);
  r.setProperty('--exam',t.exam); r.setProperty('--reminder',t.reminder);
}

db.collection('config').doc('theme').onSnapshot(
  doc => applyTheme(doc.exists ? doc.data().id : 'deepNavyGold'),
  err => console.error('Theme sync failed (check Firestore rules for /config):', err)
);

db.collection('config').doc('banner').onSnapshot(
  doc => {
    const img = document.getElementById('bannerImg');
    if(doc.exists && doc.data().url){ img.src = doc.data().url; img.style.display='block'; }
    else { img.style.display='none'; img.src=''; }
  },
  err => console.error('Banner sync failed (check Firestore rules for /config):', err)
);

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function targetTime(n){
  return new Date(`${n.date}T${n.time || '23:59'}:00`).getTime();
}

function timeLeftLabel(diff){
  if(diff<=0) return null;
  const s = Math.floor(diff/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(d>0) return `⏳ ${d}d ${h}h ${m}m left`;
  if(h>0) return `⏳ ${h}h ${m}m ${sec}s left`;
  return `⏳ ${m}m ${sec}s left`;
}

function render(){
  const c = document.getElementById('courseFilter').value;
  const t = document.getElementById('typeFilter').value;
  const grid = document.getElementById('grid');
  const now = Date.now();
  const filtered = notices.filter(n => {
    const due = targetTime(n);
    return due > now && (!c || n.course===c) && (!t || n.type===t);
  });
  if(!filtered.length){ grid.innerHTML = '<div class="empty">No upcoming notices.</div>'; return; }
  grid.innerHTML = filtered.map(n => {
    const due = targetTime(n);
    const diff = due - now;
    const urgent = diff < 24*3600*1000 ? ' urgent' : '';
    return `
    <div class="card ${n.type}" data-target="${due}">
      <span class="badge">${TYPE_LABEL[n.type]||n.type}</span>
      <h3>${n.title}</h3>
      <div class="course">${n.course||''}</div>
      <div class="date">📅 ${fmtDate(n.date)}${n.time?(' · '+n.time):''}</div>
      ${n.lecture||n.slide ? `<div class="detail">${n.lecture?('Lecture: '+n.lecture+'. '):''}${n.slide?('Slide/syllabus: '+n.slide):''}</div>`:''}
      ${n.description ? `<div class="detail">${n.description}</div>`:''}
      <div class="countdown${urgent}">${timeLeftLabel(diff)||''}</div>
    </div>`;
  }).join('');
}

function tick(){
  const now = Date.now();
  let expired = false;
  document.querySelectorAll('.card[data-target]').forEach(card => {
    const due = parseInt(card.dataset.target, 10);
    const diff = due - now;
    if(diff > 0){
      const el = card.querySelector('.countdown');
      if(el){ el.textContent = timeLeftLabel(diff); el.classList.toggle('urgent', diff < 24*3600*1000); }
    } else {
      expired = true;
    }
  });
  if(expired) render();
}
setInterval(tick, 1000);

db.collection('notices').onSnapshot(
  snap => {
    notices = snap.docs.map(d => ({id:d.id, ...d.data()}));
    notices.sort((a,b) => (a.date+'T'+(a.time||'00:00')).localeCompare(b.date+'T'+(b.time||'00:00')));
    const now = Date.now();
    const courses = [...new Set(notices.filter(n=>targetTime(n)>now).map(n=>n.course).filter(Boolean))];
    const cf = document.getElementById('courseFilter');
    cf.innerHTML = '<option value="">All courses</option>' + courses.map(c=>`<option value="${c}">${c}</option>`).join('');
    render();
  },
  err => console.error('Notices sync failed:', err)
);
document.getElementById('courseFilter').onchange = render;
document.getElementById('typeFilter').onchange = render;
</script>
</body>
</html>
