<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Notice Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📋 Section Notice Board</h1>
  <p>Tests, presentations, assignments & exams — all in one place</p>
</header>
<div class="wrap">
  <div class="filters">
    <select id="courseFilter"><option value="">All courses</option></select>
    <select id="typeFilter">
      <option value="">All types</option>
      <option value="test">Class Test</option>
      <option value="presentation">Presentation</option>
      <option value="assignment">Assignment</option>
      <option value="midterm">Midterm</option>
      <option value="final">Final Exam</option>
      <option value="reminder">Reminder</option>
    </select>
  </div>
  <div id="grid" class="grid"><div class="empty">Loading notices...</div></div>
</div>
<a class="admin-link" href="admin.html">Admin login →</a>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const TYPE_LABEL = {test:"Class Test",presentation:"Presentation",assignment:"Assignment",midterm:"Midterm",final:"Final Exam",reminder:"Reminder"};
let notices = [];

function render(){
  const c = document.getElementById('courseFilter').value;
  const t = document.getElementById('typeFilter').value;
  const grid = document.getElementById('grid');
  const filtered = notices.filter(n => (!c || n.course===c) && (!t || n.type===t));
  if(!filtered.length){ grid.innerHTML = '<div class="empty">No notices yet.</div>'; return; }
  grid.innerHTML = filtered.map(n => `
    <div class="card ${n.type}">
      <span class="badge">${TYPE_LABEL[n.type]||n.type}</span>
      <h3>${n.title}</h3>
      <div class="course">${n.course||''}</div>
      <div class="date">📅 ${n.date}</div>
      ${n.lecture||n.slide ? `<div class="detail">${n.lecture?('Lecture: '+n.lecture+'. '):''}${n.slide?('Slide/syllabus: '+n.slide):''}</div>`:''}
      ${n.description ? `<div class="detail">${n.description}</div>`:''}
    </div>`).join('');
}

db.collection('notices').orderBy('date').onSnapshot(snap => {
  notices = snap.docs.map(d => ({id:d.id, ...d.data()}));
  const courses = [...new Set(notices.map(n=>n.course).filter(Boolean))];
  const cf = document.getElementById('courseFilter');
  cf.innerHTML = '<option value="">All courses</option>' + courses.map(c=>`<option value="${c}">${c}</option>`).join('');
  render();
});
document.getElementById('courseFilter').onchange = render;
document.getElementById('typeFilter').onchange = render;
</script>
</body>
</html>
